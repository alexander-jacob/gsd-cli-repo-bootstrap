[build-system]
requires = ["setuptools>=68,<83"]
build-backend = "setuptools.build_meta"

[project]
name = "gsd-workflow-cli"
version = "2.1.5"
description = "Project-owned runtime blueprints for GSD, Claude and Codex"
requires-python = ">=3.10"
dependencies = ["click>=8.1,<9", "pydantic>=2,<3"]

[project.optional-dependencies]
test = ["pytest>=8", "pytest-xdist>=3", "jsonschema>=4"]

[project.scripts]
gsd-cli = "gsd_cli.cli:main"

[tool.setuptools.packages.find]
include = ["gsd_cli*"]

[tool.setuptools.package-data]
gsd_cli = ["data/*.json", "data/*.cjs"]
