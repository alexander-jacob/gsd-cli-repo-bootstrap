name: Test launcher

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.10', '3.11']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install package and dependencies
        run: python -m pip install .
      - name: Run unit tests (no external AI API calls)
        run: python -m unittest discover -s tests -v
      - name: Check installed resource outside the checkout
        run: |
          cd "$(mktemp -d)"
          mkdir .planning
          echo '{}' > .planning/config.json
          gsd-cli --help
          gsd-cli init
          python -c 'from gsd_cli.policy import load_default, validate; validate(load_default())'
