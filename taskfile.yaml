version: '3'

tasks:
  test:
    desc: Run the offline test suite in the active Python environment
    dir: '{{.TASKFILE_DIR}}'
    cmds:
      - python -m unittest discover -s tests -v

  install:
    desc: Install the package and Click in a pipx environment
    dir: '{{.TASKFILE_DIR}}'
    cmds:
      - pipx install .
